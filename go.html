<!doctype html>
<html lang="ko" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제주 GO</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="제주 GO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/go-icon-192.png">
<link rel="apple-touch-icon" href="assets/img/go-icon-180.png">
<link rel="stylesheet" href="assets/go.css">
</head>
<body>
<div id="app" class="loading">
  <header id="bar">
    <div id="row1">
      <button id="dayPrev" class="icobtn daynav" aria-label="이전 날">‹</button>
      <div id="dayDate">불러오는 중</div>
      <button id="dayNext" class="icobtn daynav" aria-label="다음 날">›</button>
      <button id="theme" class="icobtn" aria-label="밤 모드">🌙</button>
    </div>
    <div id="dayLabel"></div>
    <div id="who" role="group" aria-label="누구의 미션"></div>
  </header>
  <div id="clock" aria-live="polite"></div>
  <main id="deck"></main>
  <nav id="stepbar" aria-label="단계 이동">
    <button id="sPrev" class="sbtn" aria-label="이전 단계">◀</button>
    <div id="sProg"><div id="sFill"></div><span id="sNum">1 / 1</span></div>
    <button id="sNext" class="sbtn" aria-label="다음 단계">▶</button>
  </nav>
  <footer id="foot">
    <button id="btnAlerts" class="fbtn">⚠️ 주의</button>
    <button id="btnPlay"   class="fbtn">🚗 차놀이</button>
    <button id="btnClose"  class="fbtn">🌙 하루 마감</button>
  </footer>
</div>
<dialog id="sheet"><div id="sheetBody"></div><button id="sheetX" class="sheetx">닫기</button></dialog>
<script src="assets/go.js"></script>
</body>
</html>
